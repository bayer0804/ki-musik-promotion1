name: Build Niche Song Bridge APK

on:
  push:
    branches:
      - niche-song-bridge-v11
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct and verify Android source
        run: |
          cat buildsrc/source.b64.* > source.b64
          base64 --decode source.b64 > source.zip
          test "$(wc -c < source.zip)" -gt 30000
          unzip -tq source.zip
          rm -rf source
          mkdir source
          unzip -q source.zip -d source

      - name: Build debug APK
        working-directory: source/NSB_v11_Android_Chrome
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Niche-Song-Bridge-v11-debug
          path: source/NSB_v11_Android_Chrome/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
