name: BAYERKLANG custom Ubuntu image build
on:
  push:
    branches:
      - bayerklang-image-setup-20261104
    paths:
      - 'bayerklang-image/**'
      - '.github/workflows/bayerklang-image.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-qcow2:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout isolated image branch
        uses: actions/checkout@v4
      - name: Install image-building tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils libguestfs-tools curl
          # libguestfs prefers passt when installed; its sandbox fails on hosted runners.
          # Removing it makes libguestfs use QEMU SLIRP networking instead.
          sudo apt-get purge -y passt || true
          ! command -v passt
      - name: Build image and validate QCOW2
        working-directory: bayerklang-image
        run: |
          chmod +x build-qcow2.sh configure-guest.sh
          sudo ./build-qcow2.sh
          sudo chown -R "${USER}:${USER}" output
      - name: Split the verified QCOW2 into transport-safe parts
        working-directory: bayerklang-image/output
        run: |
          set -euo pipefail
          IMAGE='BAYERKLANG-KI-Desktop-1.0-Ubuntu-24.04.qcow2'
          test -s "$IMAGE"
          split --bytes=350000000 --numeric-suffixes=0 --suffix-length=2 "$IMAGE" "$IMAGE.part-"
          sha256sum "$IMAGE" > "$IMAGE.sha256"
          printf 'Reassemble with: cat %s.part-* > %s\\n' "$IMAGE" "$IMAGE" > README-PARTS.txt
          ls -lh "$IMAGE" "$IMAGE".part-*
          test -s "$IMAGE.part-00"
          test -s "$IMAGE.part-01"
          test ! -e "$IMAGE.part-02"
      - name: Upload part 1 for Google Drive transfer
        uses: actions/upload-artifact@v4
        with:
          name: BAYERKLANG-QCOW2-part-00
          path: bayerklang-image/output/*.qcow2.part-00
          retention-days: 7
          compression-level: 0
      - name: Upload part 2 for Google Drive transfer
        uses: actions/upload-artifact@v4
        with:
          name: BAYERKLANG-QCOW2-part-01
          path: bayerklang-image/output/*.qcow2.part-01
          retention-days: 7
          compression-level: 0
      - name: Upload checksums and restore instructions
        uses: actions/upload-artifact@v4
        with:
          name: BAYERKLANG-QCOW2-MANIFEST
          path: |
            bayerklang-image/output/*.sha256
            bayerklang-image/output/README-PARTS.txt
          retention-days: 30
          compression-level: 0
