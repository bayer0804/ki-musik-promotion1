name: BAYERKLANG custom Ubuntu image build
on:
  push:
    branches:
      - bayerklang-image-setup-20261104
    paths:
      - 'bayerklang-image/**'
      - '.github/workflows/bayerklang-image.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-qcow2:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout isolated image branch
        uses: actions/checkout@v4
      - name: Install image-building tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils libguestfs-tools curl
          # libguestfs prefers passt when installed; its sandbox fails on hosted runners.
          # Removing it makes libguestfs use QEMU SLIRP networking instead.
          sudo apt-get purge -y passt || true
          ! command -v passt
      - name: Build image and validate QCOW2
        working-directory: bayerklang-image
        run: |
          chmod +x build-qcow2.sh configure-guest.sh
          sudo ./build-qcow2.sh
          sudo chown -R "${USER}:${USER}" output
      - name: Split the verified QCOW2 into transport-safe parts
        working-directory: bayerklang-image/output
        run: |
          set -euo pipefail
          IMAGE='BAYERKLANG-KI-Desktop-1.0-Ubuntu-24.04.qcow2'
          test -s "$IMAGE"
          split --bytes=350000000 --numeric-suffixes=0 --suffix-length=2 "$IMAGE" "$IMAGE.part-"
          sha256sum "$IMAGE" > "$IMAGE.sha256"
          printf 'Reassemble with: cat %s.part-* > %s\\n' "$IMAGE" "$IMAGE" > README-PARTS.txt
          ls -lh "$IMAGE" "$IMAGE".part-*
          test -s "$IMAGE.part-00"
          test -s "$IMAGE.part-01"
          test ! -e "$IMAGE.part-02"
      - name: Upload part 1 for Google Drive transfer
        uses: actions/upload-artifact@v4
        with:
          name: BAYERKLANG-QCOW2-part-00
          path: bayerklang-image/output/*.qcow2.part-00
          retention-days: 7
          compression-level: 0
      - name: Upload part 2 for Google Drive transfer
        uses: actions/upload-artifact@v4
        with:
          name: BAYERKLANG-QCOW2-part-01
          path: bayerklang-image/output/*.qcow2.part-01
          retention-days: 7
          compression-level: 0
      - name: Upload checksums and restore instructions
        uses: actions/upload-artifact@v4
        with:
          name: BAYERKLANG-QCOW2-MANIFEST
          path: |
            bayerklang-image/output/*.sha256
            bayerklang-image/output/README-PARTS.txt
          retention-days: 30
          compression-level: 0

      - name: Detect securely configured R2 credentials
        id: r2_credentials
        env:
          R2_ACCOUNT_ID: ${{ secrets.BAYERKLANG_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.BAYERKLANG_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.BAYERKLANG_R2_SECRET_ACCESS_KEY }}
        run: |
          if [[ -n "$R2_ACCOUNT_ID" && -n "$R2_ACCESS_KEY_ID" && -n "$R2_SECRET_ACCESS_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Scoped R2 credentials detected."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Private R2 upload skipped: configure BAYERKLANG_R2_ACCOUNT_ID, BAYERKLANG_R2_ACCESS_KEY_ID, and BAYERKLANG_R2_SECRET_ACCESS_KEY as Actions secrets."
          fi
      - name: Install AWS CLI for authenticated multipart upload
        if: steps.r2_credentials.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if command -v aws >/dev/null 2>&1; then
            aws --version
          else
            # Official AWS CLI v2 Linux installer: the Ubuntu runner does not
            # provide an installable 'awscli' apt package in all configurations.
            sudo apt-get update -qq
            sudo apt-get install -y unzip
            curl --fail --location --silent --show-error \
              'https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip' \
              --output /tmp/awscliv2.zip
            mkdir -p /tmp/awscliv2-install
            cd /tmp/awscliv2-install
            unzip -q /tmp/awscliv2.zip
            sudo ./aws/install
            aws --version
          fi
      - name: Upload private QCOW2 to EU R2
        if: steps.r2_credentials.outputs.ready == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.BAYERKLANG_R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BAYERKLANG_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BAYERKLANG_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          cd bayerklang-image/output
          IMAGE="BAYERKLANG-KI-Desktop-1.0-Ubuntu-24.04.qcow2"
          KEY="images/BAYERKLANG-KI-Desktop-1.0-Ubuntu-24.04.qcow2"
          BUCKET="bayerklang-ki-images"
          ENDPOINT="https://${R2_ACCOUNT_ID}.eu.r2.cloudflarestorage.com"
          test -s "$IMAGE"
          sha256sum -c "${IMAGE}.sha256"
          SIZE="$(stat -c %s "$IMAGE")"
          HASH="$(sha256sum "$IMAGE" | cut -d ' ' -f1)"
          aws --endpoint-url "$ENDPOINT" s3 cp "$IMAGE" "s3://$BUCKET/$KEY" \
            --no-progress \
            --content-type application/octet-stream \
            --metadata "sha256=$HASH"
          UPLOADED_SIZE="$(aws --endpoint-url "$ENDPOINT" s3api head-object --bucket "$BUCKET" --key "$KEY" --query ContentLength --output text)"
          UPLOADED_HASH="$(aws --endpoint-url "$ENDPOINT" s3api head-object --bucket "$BUCKET" --key "$KEY" --query Metadata.sha256 --output text)"
          test "$SIZE" = "$UPLOADED_SIZE"
          test "$HASH" = "$UPLOADED_HASH"
          echo "R2 private object uploaded; size and checksum metadata verified."
          echo "Public R2 access stays DISABLED. Do NOT deploy image to Contabo before boot-testing and rotating the temporary SSH key."
